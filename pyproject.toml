[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wialon-fleet-alerts"
version = "1.0.0"
description = "Real-time alerting for Wialon fleets: offline trackers, overspeed, fuel drains, power cuts, GPS loss and geofence exits, delivered to Telegram and webhooks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Razim Kudaybergenov" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fleet-alerts = "fleet_alerts.cli:main"

[tool.setuptools.packages.find]
include = ["fleet_alerts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S311"]
