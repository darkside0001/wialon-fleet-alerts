name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Replay the demo trace
        run: fleet-alerts replay samples/demo-trace.jsonl --format md >> "$GITHUB_STEP_SUMMARY"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleet_alerts
          POSTGRES_USER: fleet_alerts
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet_alerts" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fleet_alerts:ci-only-password@localhost:5432/fleet_alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_store.py tests/test_postgres.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wialon-fleet-alerts:ci .
      - run: docker run --rm wialon-fleet-alerts:ci replay samples/demo-trace.jsonl --rules samples/rules.yaml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
